[package]
name = "kanea"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "5"
lofty = "0.25"
# Native media backend. Default Cargo feature so `cargo build` / `tauri dev`
# link system libvlc 3.x. The UI still defaults to the webview `<video>`
# player until native canvas/PCM output is confirmed; Settings opts into
# libvlc. `cargo check --no-default-features` stays HTML5-only. Renamed
# from `vlc-rs` because crates.io's `vlc` 0.1.0 is a binary crate, not a
# library; vlc-rs exposes its lib target as `vlc`.
vlc = { package = "vlc-rs", version = "0.1.0", optional = true }
# FFI types must match vlc-rs's own (its ffi aliases are built from
# libc::c_void / c_uint / c_char), so the video callbacks below reuse them.
libc = { version = "0.2", optional = true }

# Blocking HTTP for directory fetches, podcast feeds and UPnP SOAP.
# Rustls only: no OpenSSL. Identity encoding is requested so gzip is unnecessary.
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[features]
default = ["libvlc"]
libvlc = ["dep:vlc", "dep:libc"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
