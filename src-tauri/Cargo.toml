[package]
name = "kanea"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "5"
lofty = "0.25"
# Native media backend (off by default; requires system libvlc 3.x dev
# packages). Renamed from `vlc-rs` because crates.io's `vlc` 0.1.0 is a
# binary crate, not a library; vlc-rs exposes its lib target as `vlc`.
vlc = { package = "vlc-rs", version = "0.1.0", optional = true }

[features]
libvlc = ["dep:vlc"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
